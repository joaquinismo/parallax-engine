name: Generate TikTok Video

on:
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub

jobs:
  generate_video:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Hacer checkout del repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Instalar dependencias necesarias
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai moviepy boto3 requests pillow

      # 4️⃣ Generar guion
      - name: Generate Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/generate_script.py

      # 5️⃣ Renderizar vídeo con Pexels API
      - name: Render Video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python scripts/render_video.py

      # 6️⃣ Subir vídeo a GitHub Release
      - name: Upload Video to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/upload_release.py

      # 7️⃣ Confirmación final
      - name: Done
        run: echo "✅ Vídeo generado y subido correctamente"
